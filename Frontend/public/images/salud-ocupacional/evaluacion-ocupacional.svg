<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 325" role="img" aria-labelledby="t d">
  <title id="t">Evaluación ocupacional</title>
  <desc id="d">Tablero con lista de verificación médica, estetoscopio, pulso cardíaco y un escudo de salud.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3f5ef"/>
      <stop offset="1" stop-color="#cde6f4"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0c2340" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="520" height="325" fill="url(#fondo)"/>
  <circle cx="470" cy="34" r="92" fill="#ffffff" opacity="0.35"/>
  <circle cx="40" cy="310" r="110" fill="#ffffff" opacity="0.30"/>

