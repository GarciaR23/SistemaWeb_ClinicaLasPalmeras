  <rect x="316" y="106" width="94" height="92" rx="10" fill="#f6fafd" stroke="#dbe8f2"/>
  <circle cx="363" cy="152" r="26" fill="none" stroke="#dbe8f2" stroke-width="10"/>
  <circle cx="363" cy="152" r="26" fill="none" stroke="#2b86b8" stroke-width="10" stroke-linecap="round" stroke-dasharray="110 164" transform="rotate(-90 363 152)"/>
  <rect x="190" y="208" width="220" height="10" rx="5" fill="#dbe8f2"/>
  <rect x="190" y="208" width="150" height="10" rx="5" fill="#2b86b8"/>
