  <path d="M428 232 l24 9 v17 c0 15 -10 26 -24 32 c-14 -6 -24 -17 -24 -32 v-17 z" fill="#15467e"/>
  <path d="M417 260 l8 8 l15 -17" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
