<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 17 520 325" role="img" aria-labelledby="t d">
  <title id="t">Administración de personal</title>
  <desc id="d">Panel de control con gráficos, lista de usuarios con accesos y un escudo de seguridad.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f3fb"/>
      <stop offset="1" stop-color="#cfe6f5"/>
    </linearGradient>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b86b8"/>
      <stop offset="1" stop-color="#15467e"/>
    </linearGradient>
    <filter id="sombra" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0c2340" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="520" height="360" fill="url(#fondo)"/>
  <circle cx="470" cy="40" r="90" fill="#ffffff" opacity="0.35"/>
  <circle cx="40" cy="330" r="110" fill="#ffffff" opacity="0.30"/>

  <!-- Panel de control -->
