  <rect x="190" y="106" width="116" height="92" rx="10" fill="#f6fafd" stroke="#dbe8f2"/>
  <rect x="204" y="156" width="14" height="30" rx="4" fill="url(#barra)"/>
  <rect x="226" y="140" width="14" height="46" rx="4" fill="url(#barra)"/>
  <rect x="248" y="126" width="14" height="60" rx="4" fill="url(#barra)"/>
  <rect x="270" y="148" width="14" height="38" rx="4" fill="#2fa38b"/>

