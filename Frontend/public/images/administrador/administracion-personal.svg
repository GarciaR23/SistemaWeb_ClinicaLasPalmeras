  <rect x="78" y="240" width="44" height="6" rx="3" fill="#9ec3de"/>
  <rect x="160" y="228" width="28" height="16" rx="8" fill="#2fa38b"/>
  <circle cx="180" cy="236" r="6" fill="#ffffff"/>
  <circle cx="58" cy="274" r="13" fill="#6b8fb3"/>
  <rect x="78" y="264" width="66" height="8" rx="4" fill="#0c2340" opacity="0.8"/>
  <rect x="78" y="278" width="40" height="6" rx="3" fill="#9ec3de"/>
  <rect x="160" y="266" width="28" height="16" rx="8" fill="#c5d3df"/>
